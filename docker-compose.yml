# Shared base config. Not meant to be run alone — combine with an override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# Or just use `npm run docker:up`, which reads ENV from .env and picks for you.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: say-the-word-on-beat
    ports:
      - "8091:80"
    depends_on:
      - api
    networks:
      - app-network
    labels:
      - "com.say-the-word-on-beat.description=Say the Word on Beat Web Application"
      - "com.say-the-word-on-beat.version=1.0"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: say-the-word-api
    ports:
      - "3847:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/saytheword
      STALE_DAYS: 7
    depends_on:
      - mongo
    networks:
      - app-network
    labels:
      - "com.say-the-word-on-beat.description=Say the Word on Beat API Server"

  mongo:
    image: mongo:7
    container_name: say-the-word-mongo
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - app-network
    labels:
      - "com.say-the-word-on-beat.description=MongoDB Database"

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  api-logs:
    driver: local
