# Development overrides. Combine with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  web:
    restart: unless-stopped
    environment:
      NODE_ENV: development

  api:
    restart: unless-stopped
    ports:
      - "9847:9229"  # Node.js debugger port
    environment:
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:8091
      DEBUG: "express:*"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - ./server/src:/app/src:ro  # Mount source for easier debugging (read-only)
      - api-logs:/var/log  # Persist cleanup logs

  mongo:
    restart: unless-stopped
    ports:
      - "27847:27017"  # Expose MongoDB for direct access/debugging

  mongo-express:
    image: mongo-express:latest
    container_name: say-the-word-mongo-express
    restart: unless-stopped
    ports:
      - "8092:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS:-changeme123}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      - mongo
    networks:
      - app-network
    labels:
      - "com.say-the-word-on-beat.description=MongoDB Admin Interface"
