# Production overrides. Combine with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    restart: always
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  api:
    restart: always
    environment:
      NODE_ENV: production
      CORS_ORIGIN: https://saywordsonbeat.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - api-logs:/var/log  # Persist cleanup logs
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  mongo:
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  mongo-express:
    image: mongo-express:latest
    container_name: say-the-word-mongo-express
    restart: always
    ports:
      - "8092:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS:-changeme123}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "com.say-the-word-on-beat.description=MongoDB Admin Interface"
